<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Good Morning 🌸</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fffbe7;
      margin: 0;
      padding: 20px;
    }
    .container {
      margin-top: 40px;
    }
    img {
      max-width: 100%;
      max-height: 500px; /* Prevents giant images */
      border-radius: 12px;
      object-fit: cover; /* Keeps aspect ratio */
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .message {
      font-size: 1.4em;
      margin-top: 20px;
      color: #444;
    }
    .messages {
      font-size: 1.0em;
      margin-top: 20px;
      color: #444;
    }
    .share-btn {
      background: #25D366;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1.2em;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
    }
    .play-btn {
      background: #ff9800;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1.2em;
      border: none;
      cursor: pointer;
      margin-top: 20px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2>🌸 Good Morning 🌸</h2>
    
    <!-- Optimized Image -->
    <img src="ss.jpg" alt="Good Morning Flower">

    <!-- Kid Voice Greeting -->
    <audio id="gmAudio">
      <source src="kid-voice.mp3" type="audio/mpeg">
    </audio>

    <!-- Play Button -->
    <button id="playBtn" class="play-btn">🔊 Tap to Hear Greeting</button>

    <div class="message">
      🌞 Wishing you a bright and happy day ahead!  
    </div>

    <br><br>

    <div class="messages">
        <p>Share to 3 friends and see the Magic !!!</p>
    </div>

    <!-- WhatsApp Share Button -->
    <a id="shareBtn" class="share-btn" 
       href="whatsapp://send?text=🌸 Good Morning! Brighten your day 👉 https://wishmey.github.io/good-morning/"
       data-action="share/whatsapp/share">
       Share on WhatsApp
    </a>
  </div>

  <br><br><br><br>
  
  <!-- ✅ Adsterra Ads -->
  <script async="async" data-cfasync="false" src="//pl27732383.revenuecpmgate.com/bb57b279efac6ca7b1fe31b812bb06f9/invoke.js"></script>
  <div id="container-bb57b279efac6ca7b1fe31b812bb06f9"></div>

  <script type="text/javascript">
    atOptions = {
      'key' : '685a9849ddd497ecc466188fe3ed43b3',
      'format' : 'iframe',
      'height' : 60,
      'width' : 468,
      'params' : {}
    };
  </script>
  <script type="text/javascript" src="//www.highperformanceformat.com/685a9849ddd497ecc466188fe3ed43b3/invoke.js"></script>

  <script>
    // Play audio on button click
    const audio = document.getElementById("gmAudio");
    const playBtn = document.getElementById("playBtn");

    playBtn.addEventListener("click", () => {
      audio.play().then(() => {
        playBtn.style.display = "none"; // Hide button once audio plays
      }).catch(err => {
        console.log("Play failed:", err);
      });
    });
  </script>

</body>
</html>
