  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      background: #fffbe7;
      margin: 0;
      padding: 20px;
    }
    .container {
      margin-top: 40px;
    }
    img {
      max-width: 100%;
      max-height: 500px; /* Prevents giant images */
      border-radius: 12px;
      object-fit: cover; /* Keeps aspect ratio */
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
    }
    .message {
      font-size: 1.4em;
      margin-top: 20px;
      color: #444;
    }
    .messages {

      margin-top: 20px;
      color: #444;
    }
    .share-btn {
      background: #25D366;
      color: white;
      padding: 12px 20px;
      border-radius: 8px;
      font-size: 1.2em;
      text-decoration: none;
      display: inline-block;
      margin-top: 20px;
    }
    /* Fullscreen overlay */
    #overlay {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: transparent;
      z-index: 9999;
    }
  </style>
</head>
<body>

  <div class="container">

    <!-- Optimized Image -->

    <audio id="gmAudio" autoplay muted>
